# Production stack for a DigitalOcean Droplet that already runs nginx on 80/443.
# The app is published on 127.0.0.1:8090 and fronted by the host's existing
# nginx (reverse proxy + TLS). Lives at /opt/trucking-crm on the server;
# values come from /opt/trucking-crm/.env (created on the server, never committed).

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trucking_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env, e.g. ghcr.io/owner/repo:latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # FMCSA QCMobile API key for USDOT/MC carrier lookup (optional)
      FMCSA_WEBKEY: ${FMCSA_WEBKEY}
      # Transactional email (Resend HTTP API) for verification requests (optional)
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    # Bind to localhost only — the host nginx proxies to it.
    ports:
      - "127.0.0.1:8090:3000"

volumes:
  pgdata:
